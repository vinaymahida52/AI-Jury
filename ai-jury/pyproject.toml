[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aijury"
version = "0.1.0"
description = "Multi-agent deliberation system that produces verified, calibrated verdicts."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "typing-extensions>=4.9",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
db = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "openai>=1.40", "psycopg[binary]>=3.1"]

[project.scripts]
aijury = "aijury.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aijury"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
ignore_missing_imports = true
